pluginManagement {
    plugins {
        id 'org.springframework.boot' version "${springBootVersion}"
        id 'io.spring.dependency-management' version "1.1.7"
        id 'io.freefair.lombok' version "${lombokPluginVersion}"
    }
}

plugins {
    id 'eu.xenit.enterprise-conventions.oss' version '0.6.1'
}


dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
    components {
        withModule("io.fabric8:kubernetes-client") {
            allVariants {
                withDependencies {
                    add('org.bouncycastle:bcpkix-jdk15on:1.70') {
                        because 'Client depends on BouncyCastle for EC keys. See https://github.com/fabric8io/kubernetes-client/blob/master/doc/FAQ.md#what-is-bouncy-castle-optional-dependency-and-when-is-it-required'
                    }
                }
            }

        }
    }
}

rootProject.name = 'contentgrid-pathfinder'
